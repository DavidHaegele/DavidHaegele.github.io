<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ringed planet in the site's sunrise palette -->
  <defs>
    <clipPath id="ringBack"><rect x="-20" y="-40" width="140" height="90" transform="rotate(-20 50 50)"/></clipPath>
    <clipPath id="ringFront"><rect x="-20" y="50" width="140" height="90" transform="rotate(-20 50 50)"/></clipPath>
  </defs>
  <!-- far side of the ring (behind the planet) -->
  <ellipse cx="50" cy="50" rx="44" ry="13" fill="none" stroke="#d4a017" stroke-width="8"
           transform="rotate(-20 50 50)" clip-path="url(#ringBack)"/>
  <!-- planet -->
  <circle cx="50" cy="50" r="27" fill="#e8743f"/>
  <!-- subtle surface bands -->
  <path d="M25.5 40 a27 27 0 0 1 49 0 q-25 6 -49 0z" fill="#f09a63"/>
  <path d="M27 62 q23 7 46 0 a27 27 0 0 1 -46 0z" fill="#c75b32"/>
  <!-- near side of the ring (in front of the planet) -->
  <ellipse cx="50" cy="50" rx="44" ry="13" fill="none" stroke="#f9b248" stroke-width="8"
           transform="rotate(-20 50 50)" clip-path="url(#ringFront)"/>
</svg>
